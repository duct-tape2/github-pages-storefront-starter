name: Public-Safe Question
description: Ask about the free sample or the $99 repo page service.
title: "[QUESTION] "
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Public-safe only. Do not post passwords, API keys, payment details, private files, customer data, or private transaction IDs.

        Free browser checker: https://duct-tape2.github.io/storefront-checker/

        $99 repo page service: https://duct-tape2.github.io/repo-launch/
        Paid inquiry: https://github.com/duct-tape2/duct-tape2/issues/new?template=paid-inquiry.yml
  - type: dropdown
    id: topic
    attributes:
      label: Topic
      options:
        - Free checklist
        - Free template or checker
        - $99 repo page service
        - Not sure yet
    validations:
      required: true
  - type: textarea
    id: question
    attributes:
      label: Public-safe question
      placeholder: What are you trying to launch, without private details?
    validations:
      required: true
